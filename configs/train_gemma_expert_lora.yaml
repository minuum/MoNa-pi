# MoNa-pi Gemma Expert + VLM LoRA 학습 설정 (M11)
model:
  action_dim: 3
  horizon: 10
  hidden_dim: 512
  n_flow_steps: 50

  use_paligemma: true
  load_pretrained_paligemma: true
  paligemma_id: "google/paligemma-3b-pt-224"
  vision_model_id: "google/siglip-so400m-patch14-384"
  lang_model_id: "google/gemma-2b"

  # Gemma Expert + LoRA 활성화
  use_gemma_expert: true
  use_lora: true
  lora_r: 16
  load_lerobot: true

data:
  train_path: /home/minum/26CS/MoNa-pi/mobile_vla_dataset_merged/
  val_split: 0.1
  window_size: 8
  image_size: 224
  preprocess: true
  smooth: true
  normalize: false
  inject_prefix: true
  use_delta: false
  augment: true
  use_color_jitter: true
  use_random_crop: true
  use_counterfactual: true
  cf_stop_prob: 0.10
  cf_steer_prob: 0.10

train:
  batch_size: 1           # OOM 방지를 위해 배치 사이즈를 1로 하향 조정
  lr: 2.0e-5              # LoRA + expert 결합 시 낮은 학습률 권장
  epochs: 20
  warmup_steps: 300
  grad_clip: 1.0
  checkpoint_dir: checkpoints/gemma_expert_lora/
  keep_top_k: 3
  seed: 42

pretrain:
  ckpt_path: "checkpoints/lerobot_pi0_backbone"

logging:
  use_wandb: false
  project: mona-pi
  entity: shosae
  log_every_n_steps: 20
