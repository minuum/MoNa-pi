# MoNa-pi 학습 설정
# python training/train.py --config configs/train.yaml

model:
  action_dim: 3          # (linear_x, linear_y, angular_z)
  horizon: 10            # 예측 액션 청크 크기
  hidden_dim: 512        # Action Expert 히든 차원
  n_flow_steps: 50       # ODE 학습용 타임스텝 수

  # PaliGemma 백본 설정 (π0 논문 방식)
  use_paligemma: true
  load_pretrained_paligemma: true
  paligemma_id: "google/paligemma-3b-pt-224"
  vision_model_id: "google/siglip-so400m-patch14-384"
  lang_model_id: "google/gemma-2b"
  # π0 정통 Gemma Action Expert (false=커스텀 FlowMatchingHead, true=Gemma 1024-dim)
  use_gemma_expert: false
  load_lerobot: false              # true: lerobot/pi0_old gemma_expert 가중치 사용

data:
  # 통합 데이터셋: v5(150ep) + add_free(221ep) = 244 고유 에피소드
  train_path: /home/minum/26CS/MoNa-pi/mobile_vla_dataset_merged/
  val_split: 0.1         # 전체 중 10%를 검증용으로
  window_size: 8         # 이미지 이력 윈도우
  image_size: 224        # paligemma-3b-pt-224 입력 해상도
  preprocess: true       # ActionSmoother + IntentPrefix 활성화
  smooth: true
  normalize: false       # true: 데이터셋에서 정규화 완료, false: 모델 내부에서 정규화 진행 (정통 pi0 방식)
  inject_prefix: true
  use_delta: false       # True: 속도→변위 변환 실험용

  # MoNaVLA 계승: 증강 & Counterfactual
  augment: true              # HFlip 50% + angular_z 반전 + instruction 교체
  use_color_jitter: true     # ColorJitter (brightness/contrast/saturation/hue)
  use_random_crop: true      # RandomResizedCrop — 데이터 적을때 일반화 효과 (MoNaVLA exp60)
  use_counterfactual: true   # Counterfactual stop/steer 주입
  cf_stop_prob: 0.10         # 5% → 10%: 데이터 적을수록 강하게 (MoNaVLA exp60 교훈)
  cf_steer_prob: 0.10        # 5% → 10%

train:
  batch_size: 4
  lr: 1.0e-4             # 데이터 2배 → 처음부터 재학습
  epochs: 30             # 244ep 기준, 과적합 방지 (기존 70→30)
  warmup_steps: 500
  grad_clip: 1.0
  checkpoint_dir: checkpoints/
  keep_top_k: 3
  seed: 42

pretrain:
  # lerobot/pi0_old에서 추출한 로봇 데이터 적응 backbone
  ckpt_path: "checkpoints/lerobot_pi0_backbone"

logging:
  use_wandb: false       # true: W&B, false: TensorBoard
  project: mona-pi
  entity: shosae         # W&B 사용자명
  log_every_n_steps: 20
