# M8 — OOD 흉내 증강 추가 (CH9-2 free_* 14/15 실패 대응)
# python training/train.py --config configs/train_ood_aug.yaml

model:
  action_dim: 3
  horizon: 10
  hidden_dim: 512
  n_flow_steps: 50
  use_paligemma: true
  load_pretrained_paligemma: true
  paligemma_id: "google/paligemma-3b-pt-224"
  vision_model_id: "google/siglip-so400m-patch14-384"
  lang_model_id: "google/gemma-2b"
  use_gemma_expert: false
  load_lerobot: false

data:
  train_path: /home/minum/26CS/MoNa-pi/mobile_vla_dataset_merged/
  val_split: 0.1
  window_size: 8
  image_size: 224
  preprocess: true
  smooth: true
  normalize: false
  inject_prefix: true
  use_delta: false

  augment: true
  use_color_jitter: true
  use_random_crop: true
  use_counterfactual: true
  cf_stop_prob: 0.10
  cf_steer_prob: 0.10

  # M8 신규 — robot_close/far(zoom), basket_left/right_extreme(shift) 흉내
  # 윈도우(8프레임) 전체에 동일 변형 적용, diagonal_left/right는 다루지 않음(3D 시점 변화)
  use_ood_aug: true
  ood_aug_p: 0.35

train:
  batch_size: 4
  lr: 1.0e-4
  epochs: 30
  warmup_steps: 500
  grad_clip: 1.0
  checkpoint_dir: checkpoints/ood_aug/
  keep_top_k: 3
  seed: 42

pretrain:
  ckpt_path: "checkpoints/lerobot_pi0_backbone"

logging:
  use_wandb: false
  project: mona-pi
  entity: shosae
  log_every_n_steps: 20
